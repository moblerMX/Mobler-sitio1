:root{--ink:#231F20;--sand:#E0D8CC;--paper:#FFFFFF;--bone:#F3EFE9;--green:#4F573F;--terra:#A25B3E;--line:rgba(35,31,32,.16);--muted:#5d5752;
--serif:'Editor','Gilda Display','Iowan Old Style',Georgia,serif;--sans:'Futura Std','Jost','Century Gothic','Avenir Next',sans-serif;
--tap:52px;--gut:clamp(16px,3vw,48px);--hd:64px;--ease:cubic-bezier(.19,.86,.22,1);color-scheme:light}
.showroom{--tap:72px;--hd:76px;font-size:18px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bone);color:var(--ink);font:400 16px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
.showroom body{font-size:18px;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.showroom input,.showroom textarea{user-select:text;-webkit-user-select:text}
button,input,textarea{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
img{max-width:100%;display:block}h1,h2{font-family:var(--serif);font-weight:400;line-height:1.05;margin:0}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
.muted{color:var(--muted)}.wrap{padding:clamp(20px,4vh,48px) var(--gut) 64px;max-width:1720px;margin:0 auto}
.lede{font-size:1.1em;max-width:36em;margin:.6em 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:var(--tap);padding:0 1.4em;background:var(--ink);color:var(--paper);border:1px solid var(--ink);letter-spacing:.02em;transition:background .2s,color .2s,transform .12s}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-g{background:transparent;color:var(--ink)}.btn-s{min-height:44px;padding:0 1em;font-size:.92em}.showroom .btn-s{min-height:60px}
.btn-l{min-height:calc(var(--tap) + 8px);padding:0 2.2em;font-size:1.08em;background:var(--paper);color:var(--ink);border-color:var(--paper)}
.lnk{text-decoration:underline;text-underline-offset:3px;min-height:44px}
.tag{display:inline-block;font-size:.78em;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--line);color:var(--muted)}
.tag-c{border-color:var(--green);color:var(--green)}.tag-d{position:absolute;top:14px;left:14px;z-index:2;background:var(--terra);border-color:var(--terra);color:var(--paper)}
/* Encabezado */
.hd{position:sticky;top:0;z-index:20;height:var(--hd);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 var(--gut);background:var(--ink);color:var(--sand)}
.brand{display:flex;align-items:center;gap:12px;min-height:var(--tap)}.hd-logo{height:16px;width:113px;flex:none;fill:currentColor}.showroom .hd-logo{height:20px;width:141px}.brand span{letter-spacing:.32em;font-size:.82em}
.hd nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.hb{min-height:var(--tap);padding:0 14px;white-space:nowrap;border-bottom:2px solid transparent}.hb[aria-current]{border-bottom-color:var(--sand)}
/* Bienvenida */
.home{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:var(--ink);color:var(--paper);text-align:center}
.home-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62;transform:scale(1.04);animation:hz 14s var(--ease) both}
.home::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(35,31,32,.25),rgba(35,31,32,.72))}
.home-in{position:relative;z-index:1;padding:24px var(--gut);display:flex;flex-direction:column;align-items:center;animation:hin 1.2s var(--ease) both .15s}
.home-logo{width:min(56vw,420px);height:auto;fill:var(--paper)}.home-k{letter-spacing:.9em;margin:18px 0 0 .9em;font-size:clamp(14px,1.4vw,20px)}
.home h1{font-size:clamp(34px,5.4vw,86px);max-width:12em;margin:clamp(28px,6vh,64px) 0 clamp(28px,5vh,52px)}
.home-s{margin:clamp(28px,6vh,60px) 0 0;font-family:var(--serif);font-style:italic;opacity:.8}
.home.leave .home-in{animation:hout .6s var(--ease) forwards}.home.leave{animation:hclip .62s var(--ease) forwards}
@keyframes hz{from{transform:scale(1.12)}to{transform:scale(1.04)}}@keyframes hin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes hout{to{opacity:0;transform:translateY(-24px)}}@keyframes hclip{to{clip-path:inset(0 0 100% 0)}}
/* Catálogo */
.cat-h h1{font-size:clamp(40px,5vw,76px)}
.chips{display:flex;gap:8px;margin:28px 0 24px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{min-height:var(--tap);padding:0 18px;border:1px solid var(--line);background:var(--paper);white-space:nowrap}.chip span{color:var(--muted);margin-left:4px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}.chip[aria-pressed=true] span{color:var(--sand)}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(160px,17vw,280px),1fr));gap:clamp(12px,1.6vw,24px)}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;text-align:left;padding:0 0 10px}
.card-pic{display:grid;place-items:center;width:100%;aspect-ratio:4/5;background:var(--paper);padding:0;overflow:hidden;margin-bottom:6px;transition:transform .35s var(--ease)}
.card-pic img{width:100%;height:100%;object-fit:contain}.card:active .card-pic{transform:scale(.985)}
.card-ph{color:var(--ink);opacity:.6}.card-ph .ic{width:60%;height:auto}
.card-t{font-family:var(--serif);font-size:1.25em;line-height:1.15}.card-c{font-size:.88em;color:var(--muted)}
/* Configurador */
/* Pantallas anchas y mesa Neva: el mueble es el protagonista. Foto a toda la altura en la columna izquierda;
   a la derecha, de arriba abajo: nombre y estado, opciones (con su propio desplazamiento) y acciones. */
.cfgv{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,25vw,420px);grid-template-rows:minmax(0,1fr) auto;height:calc(100vh - var(--hd));height:calc(100svh - var(--hd));min-height:560px}
.cv{grid-column:1;grid-row:1;position:relative;background:var(--paper);min-height:0}
.dock{grid-column:1;grid-row:2;background:var(--sand);border-top:1px solid var(--line);max-height:44vh;display:flex;flex-direction:column;min-height:0}
.rail{grid-column:2;grid-row:1/3;background:var(--bone);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-in{flex:1;overflow:auto;padding:24px clamp(18px,1.6vw,28px)}
.crumb{margin:0 0 14px;font-size:.88em;color:var(--muted)}.pn{font-size:clamp(30px,2.6vw,46px)}
.demo-n{margin:12px 0 0;padding:10px 12px;background:rgba(162,91,62,.1);border-left:3px solid var(--terra);font-size:.88em}
.cur{list-style:none;padding:0;margin:20px 0}.cur li{padding:9px 0;border-bottom:1px solid var(--line)}.cur span{display:block;font-size:.78em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ok{color:var(--green);margin:12px 0}.ok::before{content:"● ";font-size:.8em}
.bad{background:rgba(162,91,62,.1);padding:10px 14px;margin:12px 0}.bad p{margin:0;font-weight:500}.bad ul{margin:6px 0 0;padding-left:18px}
.acts{display:grid;gap:8px;padding:14px clamp(18px,1.6vw,28px) max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bone)}
.acts-r{display:flex;flex-wrap:wrap;padding:0;border:0;background:none;margin:18px 0 0}
.tabs{display:flex;gap:2px;padding:0 var(--gut);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs button{min-height:var(--tap);padding:0 20px;border-bottom:3px solid transparent;white-space:nowrap;letter-spacing:.03em}
.tabs button[aria-selected=true]{border-bottom-color:var(--ink);font-weight:500}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--terra);vertical-align:middle}
.panel{overflow:auto;padding:14px var(--gut) 18px;display:flex;flex-wrap:wrap;gap:8px 36px;align-content:flex-start;min-height:0}
.sel{border:0;margin:0;padding:0;min-width:0;max-width:100%}.sel legend{padding:0;margin-bottom:8px;font-size:.82em;letter-spacing:.06em;text-transform:uppercase}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.tile{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:calc(var(--tap) * 1.9);min-height:calc(var(--tap) * 1.6);padding:10px 12px;background:var(--paper);border:1px solid var(--line);text-align:center;transition:border-color .2s,box-shadow .2s}
.tile[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.tile.na{opacity:.5;background:transparent;border-style:dashed}.na-m{font-size:.68em;letter-spacing:.04em;text-transform:uppercase;color:var(--terra)}
.sw{width:calc(var(--tap) * .9);height:calc(var(--tap) * .9);border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tl{font-size:.92em;line-height:1.2;max-width:12em}.t-finish{min-height:var(--tap);max-width:15em}.t-dim .tn{font-size:1.5em;font-family:var(--serif)}.tu{font-size:.75em;color:var(--muted)}
.ic{width:calc(var(--tap) * 1.05);height:auto}
.na-note{flex-basis:100%;background:var(--paper);border-left:3px solid var(--terra);padding:12px 14px}.na-note p{margin:0 0 10px}.na-a{display:flex;gap:8px;flex-wrap:wrap}
.notes{display:grid;gap:6px;flex-basis:100%;max-width:820px}.notes span{font-size:.82em;letter-spacing:.06em;text-transform:uppercase}
textarea,input[type=text],input[type=tel],input[type=email],.pf input:not([type=checkbox]){width:100%;min-height:var(--tap);padding:12px 14px;border:1px solid var(--line);background:var(--paper);border-radius:0}
/* Visor */
.vw{position:absolute;inset:0;display:flex;flex-direction:column}
.vw-st{flex:1;min-height:0;overflow:hidden;touch-action:pan-y;position:relative}
.vw-st.zoomed{touch-action:none;cursor:grab}.vw-st img{position:absolute;inset:clamp(12px,3vh,40px) clamp(12px,3vw,48px);width:calc(100% - 2*clamp(12px,3vw,48px));height:calc(100% - 2*clamp(12px,3vh,40px));object-fit:contain;transform-origin:center;transition:transform .08s linear;-webkit-user-drag:none;user-select:none}
.vw-cap{margin:0;padding:10px var(--gut) 14px;font-size:.88em;color:var(--muted)}.vw-cap b{color:var(--terra);font-weight:500}
.vw-reset{position:absolute;right:14px;top:14px;z-index:2;min-height:44px;padding:0 14px;background:var(--paper);border:1px solid var(--line)}
.vw-m{position:absolute;right:14px;top:14px;z-index:3;display:flex;background:var(--paper);border:1px solid var(--line)}.vw-m button{min-height:44px;padding:0 16px}.vw-m [aria-pressed=true]{background:var(--ink);color:var(--paper)}
.vw-empty{justify-content:center;align-items:center;gap:20px;padding:24px}.vw-msg{max-width:30em;text-align:center;color:var(--muted);margin:0}
.mb{display:flex;align-items:center;gap:clamp(24px,4vw,64px);flex-wrap:wrap;justify-content:center}.mb-st{display:grid;justify-items:center;gap:8px}.mb-st .ic{width:clamp(110px,12vw,180px)}
.mb-l{display:flex;gap:clamp(18px,3vw,40px)}.mb-i{display:grid;justify-items:center;gap:4px;text-align:center;max-width:12em}
.mb-sw{width:clamp(80px,9vw,140px);aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}.mb-p{font-size:.76em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}.mb-m{font-family:var(--serif);font-size:1.3em}.mb-f{font-size:.85em;color:var(--muted)}
.vw-3d{flex:1;min-height:0}.vw-3d model-viewer{width:100%;height:100%}.vw-ctl{display:flex;gap:6px;justify-content:center;padding:8px;flex-wrap:wrap}.vw-ctl button{min-height:var(--tap);padding:0 16px;border:1px solid var(--line);background:var(--paper)}
.det .dock{max-height:none}
/* Resumen */
.sum-h h1,.cmp h1{font-size:clamp(40px,4.6vw,72px)}
.sum-g{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,4vw,72px);margin-top:28px;align-items:start}
.sum-f{margin:0;background:var(--paper);padding:clamp(16px,3vw,40px);position:sticky;top:calc(var(--hd) + 16px)}.sum-f img{margin:0 auto;max-height:60vh;object-fit:contain}.sum-f figcaption{margin-top:12px;font-size:.88em;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{text-align:left;vertical-align:top;padding:11px 12px 11px 0;border-bottom:1px solid var(--line)}.tbl th{font-weight:400;color:var(--muted);width:42%}
.meta{font-size:.85em;color:var(--muted);margin:12px 0 0}
.pf{margin-top:36px;padding-top:28px;border-top:1px solid var(--ink)}.pf h2{font-size:clamp(28px,2.4vw,40px)}.pf-g{display:grid;gap:14px;margin:18px 0}
.pf label{display:grid;gap:6px}.ck{display:flex!important;grid-template-columns:none;gap:12px!important;align-items:flex-start;min-height:44px}.ck input{width:32px;height:32px;flex:none;margin:2px 0 0;accent-color:var(--ink)}
.err{color:var(--terra);font-size:.88em;min-height:0}.pf input[aria-invalid=true]{border-color:var(--terra)}
.pf-msg{margin:14px 0 0}.pf-msg.warn{padding:12px 14px;background:rgba(162,91,62,.1);border-left:3px solid var(--terra)}.done{border-top-color:var(--green)}
/* Comparar */
.svl{list-style:none;padding:0;margin:24px 0}.sv{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
.sv-sel{flex:1;min-width:220px;display:grid;text-align:left;min-height:var(--tap);padding:8px 12px 8px 48px;position:relative}
.sv-sel::before{content:"";position:absolute;left:8px;top:50%;width:26px;height:26px;margin-top:-13px;border:1px solid var(--ink);background:var(--paper)}
.sv-sel[aria-pressed=true]::before{background:var(--ink);box-shadow:inset 0 0 0 5px var(--paper)}.sv-t{font-family:var(--serif);font-size:1.2em}
.tbl-w{overflow-x:auto}.cmp-t th[scope=col]{color:var(--ink);font-weight:500}.cmp-t tr.diff td{background:rgba(162,91,62,.08)}
/* Avisos */
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;pointer-events:none;z-index:50;background:var(--ink);color:var(--paper);padding:14px 20px;max-width:min(92vw,640px);transition:opacity .25s,transform .25s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.idle{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(35,31,32,.6);padding:20px}.idle[hidden]{display:none}
.idle-in{background:var(--bone);padding:clamp(24px,4vw,48px);max-width:560px;text-align:center}.idle-in h2{font-size:clamp(30px,3vw,44px);margin-bottom:12px}
.sr-flag{position:fixed;right:10px;bottom:8px;z-index:5;margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);pointer-events:none}
[hidden]{display:none!important}
/* Pantallas verticales y teléfonos */
@media (max-width:899px),(orientation:portrait) and (max-width:1199px){
 .cfgv{display:flex;flex-direction:column;height:auto;min-height:0}
 .cv{height:min(52svh,560px);min-height:300px;order:1}.rail{order:2;border-left:0;border-top:1px solid var(--line)}.dock{order:3;max-height:none}
 .rail-in{padding:18px var(--gut) 4px}.cur{display:none}
 .acts{position:sticky;bottom:0;z-index:10;grid-template-columns:.8fr .9fr 1.5fr;gap:6px;padding:8px var(--gut) max(8px,env(safe-area-inset-bottom))}.acts .btn{padding:0 .5em;font-size:.9em;line-height:1.15}
 .rail{display:contents}.rail-in{order:2}.acts{order:4}
 /* Móvil: el mueble manda. Foto a todo el ancho en 4:5, miniaturas y leyenda debajo; el diseño se acomoda a ella */
 .cv{height:auto;min-height:0}
 .cv .vw{position:relative;inset:auto}
 .cv .vw-st{flex:none;width:100%;aspect-ratio:4/5;max-height:80svh}
 .cv .vw-st img{inset:0;width:100%;height:100%}
 .cv .vw-3d{flex:none;height:70svh}
 .cv .vw-empty{min-height:50svh}
 .vw-gal{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding:10px var(--gut) 0;gap:8px}
 .vw-gal button{flex:none;width:56px;height:70px}

}
@media (max-width:560px){.hd{gap:6px}.brand span{display:none}.hd-logo{width:90px;height:13px}.hb{padding:0 10px}.tile{min-width:calc(var(--tap) * 1.7)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Galería de la pieza */
.vw-gal{display:flex;gap:10px;justify-content:center;padding:6px var(--gut) 0;flex-wrap:wrap}
.vw-gal button{width:64px;height:80px;padding:0;border:1px solid var(--line);background:var(--paper);overflow:hidden;opacity:.72;transition:opacity .2s,border-color .2s}
.vw-gal button:hover{opacity:1}
.vw-gal button[aria-pressed=true]{opacity:1;border-color:var(--ink);outline:2px solid var(--ink);outline-offset:2px}
.vw-gal img{width:100%;height:100%;object-fit:cover;display:block}
.showroom .vw-gal button{width:var(--tap,72px);height:calc(var(--tap,72px)*1.25)}

/* Biblioteca de materiales: especies y tintas */
.t-species,.t-ink{flex-direction:row;justify-content:flex-start;align-items:center;gap:14px;text-align:left;min-width:calc(var(--tap) * 5);padding:10px 16px 10px 10px}
.sp-pic{flex:none;width:calc(var(--tap) * 1.15);height:calc(var(--tap) * 1.15);overflow:hidden;border:1px solid var(--line)}
.sp-pic img{width:100%;height:100%;object-fit:cover}

.sp-t{display:grid;gap:1px;min-width:0}
.sp-n{font-size:1.05em}.sp-s{font-family:var(--serif);font-size:.95em;color:var(--muted)}
.sp-m{font-size:.78em;letter-spacing:.04em;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pend{margin:4px 0 0;padding:12px 14px;border-left:3px solid var(--sand);background:var(--paper);max-width:38em}
.vw-mat{display:block;margin-bottom:4px;color:var(--ink)}
.sci{font-family:var(--serif);color:var(--muted)}
/* Maderas y tintas: todas visibles a la vez (rejilla), nunca escondidas en un carrusel horizontal */
.row-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--tap) * 5),1fr));overflow:visible}
.row-grid .t-species,.row-grid .t-ink{min-width:0}
@media (max-width:560px){.row-grid{grid-template-columns:1fr 1fr;gap:6px}.row-grid .t-species,.row-grid .t-ink{flex-direction:column;align-items:flex-start;gap:8px;padding:8px}.row-grid .sp-pic{width:100%;height:56px}}

/* Miniatura flotante (móvil) con la foto de la combinación recién elegida */
.peek{position:fixed;left:var(--gut,16px);z-index:40;display:flex;align-items:center;gap:12px;padding:6px 14px 6px 6px;background:var(--paper);border:1px solid var(--ink);box-shadow:0 8px 28px rgba(35,31,32,.22);text-align:left;max-width:calc(100vw - 2*var(--gut,16px));opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .25s,transform .25s var(--ease,ease)}
.peek.on{opacity:1;transform:none;pointer-events:auto}
.peek i{width:72px;height:90px;overflow:hidden;display:block;flex:none;background:var(--bone)}.peek img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.9);transform-origin:50% 52%}
.peek span{display:grid;gap:4px;min-width:0}.peek b{font-weight:500;font-size:.95em;line-height:1.25}.peek small{font-size:.82em;color:var(--terra)}

 .vw-hasgal .vw-cap{grid-column:1/3;grid-row:2}
 .vw-cap{padding:6px var(--gut) 10px;font-size:.84em}
 .acts{grid-template-columns:.8fr .9fr 1.4fr;padding-top:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}.acts .btn{padding:0 .6em;line-height:1.15}
 .cv{grid-column:1;grid-row:1/4}

 .rail-in .pn{font-size:clamp(26px,2.2vw,40px);margin:0}.rail-in .crumb{margin-bottom:6px}.rail-in .cur{display:none}.rail-in .ok,.rail-in .bad{margin:8px 0 0}

 .det .rail-in .cur{display:block}
 .vw-st img{inset:clamp(8px,1.5vh,24px) clamp(8px,1.5vw,24px);width:calc(100% - 2*clamp(8px,1.5vw,24px));height:calc(100% - 2*clamp(8px,1.5vh,24px))}
 .row-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,calc(var(--tap) * 4)),1fr))}
}

  /* ---------- Selectores ---------- */
  function tile(p, k, v, sel, inner, extra) {
    var on = String(sel[k]) === String(v), c = E.check(p, sel, k, v);
    return '<button type="button" class="tile' + (c.ok ? '' : ' na') + (extra || '') + '" data-a="' + (c.ok ? 'set' : 'na') + '" data-k="' + k + '" data-v="' + esc(v) + '" aria-pressed="' + on + '"' + (c.ok ? '' : ' aria-describedby="naHint"') + '>' + inner + (c.ok ? '' : '<span class="na-m">No compatible</span>') + '</button>';
  }
  function MaterialSelector(p, k, sel) {
    var o = p.options[k];
    if (o.kind === 'finish' && !E.applicable(p, k, sel)) {
      if (o.pendingNote) return '<fieldset class="sel"><legend>' + esc(o.label) + '</legend>' + (sel[o.dependsOn] == null ? '<p class="muted">Elija primero la madera.</p>' : Pending('Las muestras de tinta para ' + E.valueLabel(p, o.dependsOn, sel[o.dependsOn]).toLowerCase() + ' están pendientes. Su asesor confirmará las opciones disponibles.')) + '</fieldset>';
      return '<fieldset class="sel"><legend>' + esc(o.label) + '</legend><p class="muted">No aplica para ' + esc(E.valueLabel(p, o.dependsOn, sel[o.dependsOn])) + '.</p></fieldset>';
    }
    var vals = o.kind === 'finish' ? E.choices(p, k, sel) : E.values(p, k);
    var tiles = vals.map(function (v) {
      var x = o.values.filter(function (y) { return y.id === v; })[0], inner;
      if (o.kind === 'material' && x.species) inner = SpeciesFace(x);
      else if (o.kind === 'finish' && x.finish) inner = FinishFace(x);
      else if (o.kind === 'material') inner = '<span class="sw" style="' + swatchStyle(x.swatch) + '"></span><span class="tl">' + esc(x.label) + '</span>';
      else if (o.kind === 'structure') inner = ICON(x.icon) + '<span class="tl">' + esc(x.label) + '</span>';
      else inner = '<span class="tl">' + esc(x.label) + '</span>';
      return tile(p, k, v, sel, inner, ' t-' + o.kind + (x.species ? ' t-species' : '') + (x.finish ? ' t-ink' : ''));

    var grid = (o.kind === 'material' || o.kind === 'finish') && o.values.some(function (y) { return y.species || y.finish; });
    return '<fieldset class="sel"><legend>' + esc(o.label) + '</legend><div class="row' + (grid ? ' row-grid' : '') + '">' + tiles + '</div></fieldset>';
  }
  /* Especie: nombre común, científico en cursiva y maya cuando existe. Sin foto: presentación neutra (inicial), sin color inventado. */

  /* ---------- ProductConfigurator ---------- */
  function Dock(p, cfg) {
    var groups = p.groups, tab = S.tab && groups.some(function (g) { return g.id === S.tab; }) ? S.tab : groups[0].id, g = groups.filter(function (x) { return x.id === tab; })[0];
    var tabs = groups.map(function (x) {

  /* ---------- ConfigurationSummary + ProposalForm ---------- */
  function rows(p, cfg) {

    (cfg.materials || []).forEach(function (m) {
      if (p.materialsDriven) {
        var o = p.options[m.part + 'Wood'], v = o && o.values.filter(function (x) { return x.id === m.material; })[0];
        r.push([m.partLabel + ', madera', m.material ? m.materialLabel : 'Por elegir', v && v.species ? v.species.sci : '']);
        r.push([m.partLabel + ', tinta y acabado', m.finish ? m.finishLabel : (m.material ? 'Muestras pendientes; lo confirmará su asesor' : 'Por elegir')]);
        return;
